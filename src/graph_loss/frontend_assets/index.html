<!DOCTYPE html>
<meta charset='utf-8'>
<meta name='viewport' content='width=2000, initial-scale=1'>
<link rel='stylesheet' href='./style.css'>
<title>Attribution Graphs</title>

<div class='tooltip tooltip-hidden'></div>
<div class='dual-graph-container'>
  <div class='graph-panel' id='graph-panel-left'></div>
  <div class='graph-panel' id='graph-panel-right'></div>
</div>

<link rel='stylesheet' href='./attribution_graph/cg.css'>
<link rel='stylesheet' href='./attribution_graph/gridsnap/gridsnap.css'>

<script src='https://transformer-circuits.pub/2025/attribution-graphs/static_js/lib/hotserver-client-ws.js'></script>
<script src='https://transformer-circuits.pub/2025/attribution-graphs/static_js/lib/d3.js'></script>
<script src='https://transformer-circuits.pub/2025/attribution-graphs/static_js/lib/jetpack_2024-07-20.js'></script>
<script src='https://transformer-circuits.pub/2025/attribution-graphs/static_js/lib/npy_v0.js'></script>
<script src='https://unpkg.com/dagre@0.8.5/dist/dagre.min.js'></script>
<script src='https://unpkg.com/pako@2.1.0/dist/pako.min.js'></script>

<script src='./util.js'></script>
<script src='./attribution_graph/util-cg.js'></script>
<script src='./attribution_graph/render-act-histogram.js'></script>
<script src='./attribution_graph/gridsnap/init-gridsnap.js'></script>
<script src='./attribution_graph/init-cg-button-container.js'></script>
<script src='./attribution_graph/init-cg-link-graph.js'></script>
<script src='./attribution_graph/init-cg-node-connections.js'></script>
<script src='./attribution_graph/init-cg-clerp-list.js'></script>
<script src='./attribution_graph/init-cg-feature-detail.js'></script>
<script src='./attribution_graph/init-cg-feature-scatter.js'></script>
<script src='./attribution_graph/init-cg-subgraph.js'></script>
<script src='./attribution_graph/init-cg.js'></script>

<script>
window.init = async function(){
  window.isLocalServing = true;
  var {graphs} = await util.getFile('./data/graph-metadata.json', false)

  window.visState = window.visState || {
    slug:  util.params.get('slug')  || graphs[0].slug,
    slug2: util.params.get('slug2') || graphs[Math.min(1, graphs.length - 1)].slug,
    clickedId:  util.params.get('clickedId')?.replace('null', ''),
    clickedId2: util.params.get('clickedId2')?.replace('null', ''),
    isGridsnap: util.params.get('isGridsnap')?.replace('null', ''),
  }

  // Initialize pruning thresholds for both panels
  ;[['slug', 'pruningThreshold'], ['slug2', 'pruningThreshold2']].forEach(([slugKey, thresholdKey]) => {
    var g = graphs.find(g => g.slug === visState[slugKey])
    if (g && typeof g.node_threshold === 'number') {
      visState[thresholdKey] = util.params.get(thresholdKey) || g.node_threshold || 0.4
    }
  })

  createPanel(d3.select('#graph-panel-left'), {
    slugKey: 'slug',
    thresholdKey: 'pruningThreshold',
    clickedIdKey: 'clickedId',
  })
  createPanel(d3.select('#graph-panel-right'), {
    slugKey: 'slug2',
    thresholdKey: 'pruningThreshold2',
    clickedIdKey: 'clickedId2',
  })

  function createPanel(panelSel, {slugKey, thresholdKey, clickedIdKey}) {
    var navSel = panelSel.append('div.panel-nav')
      .style('display', 'flex')
      .style('align-items', 'center')
      .style('gap', '12px')
      .style('padding-bottom', '8px')
      .style('border-bottom', '1px solid #eee')
      .style('margin-bottom', '8px')

    var cgSel = panelSel.append('div.cg')

    var selectSel = navSel.append('select.graph-prompt-select')
      .style('flex', '1')
      .style('min-width', '0')
      .on('click', async function() {
        if (!window.isLocalServing) return
        var {graphs: newGraphs} = await util.getFile('./data/graph-metadata.json', false)
        graphs = newGraphs
        selectSel.selectAll('option').remove()
        selectSel.appendMany('option', graphs)
          .text(d => d.slug)
          .attr('value', d => d.slug)
          .property('selected', d => d.slug === visState[slugKey])
      })
      .on('change', function() {
        visState[slugKey] = this.value
        visState[clickedIdKey] = undefined
        util.params.set(slugKey, this.value)

        var newGraph = graphs.find(g => g.slug === this.value)
        if (newGraph && typeof newGraph.node_threshold === 'number') {
          visState[thresholdKey] = newGraph.node_threshold || 0.4
        } else {
          delete visState[thresholdKey]
          util.params.set(thresholdKey, null)
        }

        render()
      })

    selectSel.appendMany('option', graphs)
      .text(d => d.slug)
      .attr('value', d => d.slug)
      .property('selected', d => d.slug === visState[slugKey])

    var debouncedRender = util.debounce(render, 300)
    var sliderContainer

    function render() {
      var m = graphs.find(g => g.slug == visState[slugKey])
      if (!m) return

      // Create or remove pruning slider depending on graph support
      if (typeof m.node_threshold === 'number') {
        if (!sliderContainer) {
          sliderContainer = navSel.append('div.slider-container')
            .style('display', 'flex')
            .style('align-items', 'center')
            .style('gap', '6px')
            .style('white-space', 'nowrap')

          sliderContainer.append('span')
            .style('font-size', '12px')
            .text('Pruning:')

          var sliderSel = sliderContainer.append('input')
            .attr('type', 'range')
            .attr('min', 0)
            .attr('max', m.node_threshold)
            .attr('step', 0.01)
            .attr('value', visState[thresholdKey] || m.node_threshold)
            .on('input', function() {
              visState[thresholdKey] = this.value
              util.params.set(thresholdKey, this.value)
              valueDisplay.text(parseFloat(this.value).toFixed(2))
              debouncedRender()
            })

          var valueDisplay = sliderContainer.append('span.value-display')
            .style('font-size', '12px')
            .text(parseFloat(visState[thresholdKey] || m.node_threshold).toFixed(2))
        }

        sliderContainer.select('input')
          .attr('max', m.node_threshold)
          .property('value', visState[thresholdKey] || m.node_threshold)

        sliderContainer.select('.value-display')
          .text(parseFloat(visState[thresholdKey] || m.node_threshold).toFixed(2))

        sliderContainer.style('display', 'flex')

        if (visState[thresholdKey] === undefined) {
          visState[thresholdKey] = m.node_threshold
        }
      } else {
        if (sliderContainer) {
          sliderContainer.remove()
          sliderContainer = null
        }
        delete visState[thresholdKey]
        util.params.set(thresholdKey, null)
      }

      cgSel.html('')

      var options = {
        clickedId: visState[clickedIdKey],
        clickedIdCb: id => util.params.set(clickedIdKey, id),
        isGridsnap: visState.isGridsnap || true,
      }

      if (visState[thresholdKey] !== undefined) {
        options.pruningThreshold = visState[thresholdKey]
      }

      initCg(cgSel, visState[slugKey], options)
      selectSel.at({title: m.prompt})
      document.title = 'Attribution Graphs'
    }

    render()
  }
}

window.init()
</script>
